<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eisenhower</title>
    <style>
      /* ── colour scheme ─────────────────────────────────────────────── */
      :root {
        --bg: #131312;
        --surface: #1a1a19;
        --line: #2c2c2a;
        --ink: #ffffff;
        --ink-2: #c3c2b7;
        --ink-3: #85847c;
        --accent: #3987e5;
        --danger: #e66767;
        --warn: #c98500;

        /* categorical slots — validated for the dark surface, fixed order */
        --s1: #3987e5;
        --s2: #d95926;
        --s3: #199e70;
        --s4: #c98500;
        --s5: #d55181;
        --s6: #008300;
        --s7: #9085e9;
        --s8: #e66767;

        --radius: 10px;
        --pad: 20px;
        --font: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 1060px; margin: 0 auto; padding: 48px var(--pad) 96px; }

      header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 28px; }
      h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
      .sub { color: var(--ink-3); font-size: 13px; }
      .status { margin-left: auto; font-size: 12px; color: var(--ink-3); font-family: var(--mono); }
      .status[data-state="error"] { color: var(--danger); }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
      }

      svg { display: block; width: 100%; height: auto; }
      .grid { stroke: var(--line); stroke-width: 1; }
      .axis { fill: var(--ink-3); font-size: 11px; font-family: var(--mono); }
      .axis-title { fill: var(--ink-3); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
      .today { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.8; }
      .mark { cursor: pointer; stroke-width: 2; }
      .mark:hover { stroke: var(--ink); }

      .legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
      .chip {
        display: inline-flex; align-items: center; gap: 7px;
        border: 1px solid var(--line); background: transparent; color: var(--ink-2);
        border-radius: 999px; padding: 4px 11px 4px 8px; font-size: 12.5px; cursor: pointer;
        white-space: nowrap;
      }
      input[type="checkbox"] { accent-color: var(--accent); }
      .chip[aria-pressed="false"] { opacity: 0.35; }
      .chip:hover { border-color: var(--ink-3); }

      form {
        display: grid; gap: 8px; margin: 28px 0 18px;
        grid-template-columns: minmax(160px, 2fr) minmax(110px, 1fr) 150px 110px auto;
      }
      input, select, button {
        font: inherit; color: var(--ink);
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 8px; padding: 8px 10px;
      }
      input:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
      button { cursor: pointer; }
      button:hover { border-color: var(--ink-3); }
      form button { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 550; }

      .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; color: var(--ink-3); font-size: 13px; }
      .bar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

      .row {
        display: grid; align-items: center; gap: 12px;
        grid-template-columns: 16px 1fr 96px 96px 68px 44px 24px;
        padding: 9px 12px; border-bottom: 1px solid var(--line);
      }
      .row:hover { background: var(--surface); }
      .row.done .name, .row.done .course { color: var(--ink-3); text-decoration: line-through; }
      .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .course { color: var(--ink-2); font-size: 13px; }
      .due { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); }
      .left { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
      .left.soon { color: var(--warn); }
      .left.over { color: var(--danger); }
      .imp { letter-spacing: 2px; color: var(--ink-3); font-size: 11px; }
      .del { background: none; border: 0; color: var(--ink-3); padding: 2px 6px; }
      .del:hover { color: var(--danger); }
      .empty { color: var(--ink-3); padding: 24px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Eisenhower</h1>
        <span class="sub" id="count"></span>
        <span class="status" id="status"></span>
      </header>

      <div class="card">
        <svg id="plot" viewBox="0 0 1000 400" role="img" aria-label="Assignments by due date and importance"></svg>
      </div>
      <div class="legend" id="legend"></div>

      <form id="add" autocomplete="off">
        <input id="f-name" placeholder="assignment" required />
        <input id="f-course" placeholder="course" list="courses" required />
        <datalist id="courses"></datalist>
        <input id="f-due" type="date" required />
        <select id="f-imp">
          <option value="1">low</option>
          <option value="2" selected>medium</option>
          <option value="3">high</option>
        </select>
        <button>Add</button>
      </form>

      <div class="bar">
        <label><input type="checkbox" id="hide-done" checked /> hide done</label>
        <span id="filter-note"></span>
      </div>
      <div id="list"></div>
    </div>

    <script>
      const SHAPES = ['circle', 'square', 'triangle', 'diamond', 'down'];
      const SLOTS = 8;
      const DAY = 86400000;
      const $ = (s) => document.querySelector(s);

      let db = { courses: [], assignments: [] };
      let hidden = new Set(); // courses toggled off in the legend

      const color = (course) => `var(--s${(db.courses.indexOf(course) % SLOTS) + 1})`;
      const shape = (course) => SHAPES[db.courses.indexOf(course) % SHAPES.length];
      const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
      const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
      const daysLeft = (a) => Math.round((parse(a.due) - today()) / DAY);
      const fmt = (d) => d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
      const hash = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return h; };

      // one marker element, whatever its shape
      function mark(kind, x, y, r, attrs, inner = '') {
        const pts = {
          triangle: `${x},${y - r * 1.15} ${x + r * 1.1},${y + r * 0.8} ${x - r * 1.1},${y + r * 0.8}`,
          down: `${x},${y + r * 1.15} ${x + r * 1.1},${y - r * 0.8} ${x - r * 1.1},${y - r * 0.8}`,
          diamond: `${x},${y - r * 1.3} ${x + r * 1.2},${y} ${x},${y + r * 1.3} ${x - r * 1.2},${y}`,
        }[kind];
        const [tag, geo] =
          kind === 'circle'
            ? ['circle', `cx="${x}" cy="${y}" r="${r}"`]
            : kind === 'square'
              ? ['rect', `x="${x - r}" y="${y - r}" width="${r * 2}" height="${r * 2}" rx="1.5"`]
              : ['polygon', `points="${pts}"`];
        return `<${tag} ${geo} ${attrs}>${inner}</${tag}>`;
      }

      function visible() {
        return db.assignments.filter((a) => !hidden.has(a.course) && !(a.done && $('#hide-done').checked));
      }

      function drawPlot() {
        const W = 1000, H = 400, L = 56, R = 24, T = 24, B = 52;
        const items = visible();
        const t0 = today();
        const dates = items.map((a) => parse(a.due));
        const min = new Date(Math.min(t0, ...dates) - DAY);
        const max = new Date(Math.max(t0.getTime() + DAY * 7, ...dates) + DAY);
        const span = Math.max(1, (max - min) / DAY);
        const x = (d) => L + ((d - min) / DAY / span) * (W - L - R);
        const band = (H - T - B) / 3;
        const y = (imp, jit) => H - B - (imp - 0.5) * band + jit * band * 0.62;

        let svg = '';
        // importance bands
        for (let i = 1; i <= 3; i++) {
          const yy = H - B - (i - 0.5) * band;
          svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" />`;
          svg += `<text class="axis" x="${L - 12}" y="${yy + 4}" text-anchor="end">${['low', 'med', 'high'][i - 1]}</text>`;
        }
        // date ticks
        const step = Math.max(1, Math.ceil(span / 9));
        for (let d = 0; d <= span; d += step) {
          const date = new Date(min.getTime() + d * DAY);
          svg += `<text class="axis" x="${x(date)}" y="${H - B + 22}" text-anchor="middle">${fmt(date)}</text>`;
        }
        svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" />`;
        svg += `<line class="today" x1="${x(t0)}" x2="${x(t0)}" y1="${T}" y2="${H - B}" />`;
        svg += `<text class="axis" x="${x(t0) + 6}" y="${T + 11}" fill="var(--accent)">today</text>`;
        svg += `<text class="axis-title" x="${W / 2}" y="${H - 8}" text-anchor="middle">due date</text>`;
        svg += `<text class="axis-title" transform="translate(16 ${(H - B + T) / 2}) rotate(-90)" text-anchor="middle">importance</text>`;

        for (const a of items) {
          const jit = ((hash(a.id) % 100) / 100 - 0.5) * 2;
          const cx = x(parse(a.due)), cy = y(a.importance, jit), c = color(a.course);
          svg += mark(
            shape(a.course), cx, cy, 6,
            `class="mark" fill="${a.done ? 'none' : c}" stroke="${c}" data-id="${a.id}" opacity="${a.done ? 0.6 : 1}"`,
            `<title>${a.name} · ${a.course} · ${a.due} (${daysLeft(a)}d)</title>`
          );
        }
        $('#plot').innerHTML = svg;
      }

      function drawLegend() {
        $('#legend').innerHTML = db.courses
          .map(
            (c) => `<button class="chip" aria-pressed="${!hidden.has(c)}" data-course="${c}">
              <svg width="12" height="12" viewBox="0 0 12 12">${mark(shape(c), 6, 6, 4.5, `fill="${color(c)}"`)}</svg>
              ${c}</button>`
          )
          .join('');
        $('#courses').innerHTML = db.courses.map((c) => `<option value="${c}">`).join('');
      }

      function drawList() {
        const items = visible().sort((a, b) => a.due.localeCompare(b.due) || a.name.localeCompare(b.name));
        $('#count').textContent = `${db.assignments.filter((a) => !a.done).length} open`;
        $('#list').innerHTML =
          items
            .map((a) => {
              const d = daysLeft(a);
              const cls = d < 0 ? 'over' : d <= 2 ? 'soon' : '';
              return `<div class="row ${a.done ? 'done' : ''}">
                <input type="checkbox" data-toggle="${a.id}" ${a.done ? 'checked' : ''} />
                <span class="name">${a.name}</span>
                <span class="course" style="color:${color(a.course)}">${a.course}</span>
                <span class="due">${a.due}</span>
                <span class="left ${cls}">${d < 0 ? `${-d}d late` : `${d}d`}</span>
                <span class="imp">${'●'.repeat(a.importance)}${'○'.repeat(3 - a.importance)}</span>
                <button class="del" data-del="${a.id}" title="delete">×</button>
              </div>`;
            })
            .join('') || '<div class="empty">nothing here.</div>';
      }

      const render = () => { drawPlot(); drawLegend(); drawList(); };

      async function save(msg) {
        render();
        const s = $('#status');
        try {
          const r = await fetch('/db', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ data: db, msg }),
          });
          if (!r.ok) throw new Error(await r.text());
          s.dataset.state = 'ok';
          s.textContent = 'saved';
        } catch (e) {
          s.dataset.state = 'error';
          s.textContent = 'not saved: ' + e.message;
        }
      }

      $('#add').onsubmit = (e) => {
        e.preventDefault();
        const course = $('#f-course').value.trim();
        const a = {
          id: Math.random().toString(36).slice(2, 9),
          name: $('#f-name').value.trim(),
          course,
          due: $('#f-due').value,
          importance: +$('#f-imp').value,
          done: false,
        };
        if (!db.courses.includes(course)) db.courses.push(course);
        db.assignments.push(a);
        e.target.reset();
        $('#f-imp').value = '2';
        $('#f-name').focus();
        save(`add ${a.name} (${a.course}) due ${a.due}`);
      };

      document.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (chip) {
          const c = chip.dataset.course;
          hidden.has(c) ? hidden.delete(c) : hidden.add(c);
          render();
          return;
        }
        const mark = e.target.closest('.mark');
        const id = mark?.dataset.id || e.target.dataset.toggle;
        if (id) {
          const a = db.assignments.find((x) => x.id === id);
          a.done = !a.done;
          return save(`${a.done ? 'done' : 'reopen'}: ${a.name} (${a.course})`);
        }
        const del = e.target.dataset.del;
        if (del) {
          const a = db.assignments.find((x) => x.id === del);
          db.assignments = db.assignments.filter((x) => x.id !== del);
          save(`delete ${a.name} (${a.course})`);
        }
      });

      $('#hide-done').onchange = render;

      fetch('db.json')
        .then((r) => r.json())
        .then((d) => { db = d; render(); })
        .catch(() => ($('#list').innerHTML = '<div class="empty">run <code>node server.js</code> and open localhost:47913</div>'));
    </script>
  </body>
</html>
