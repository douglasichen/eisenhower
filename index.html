<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eisenhower</title>
    <style>
      /* ── colour scheme ─────────────────────────────────────────────── */
      :root {
        --bg: #131312;
        --surface: #1a1a19;
        --line: #2c2c2a;
        --ink: #ffffff;
        --ink-2: #c3c2b7;
        --ink-3: #85847c;
        --accent: #3987e5;
        --danger: #e66767;
        --warn: #c98500;

        /* categorical slots — validated for the dark surface, fixed order */
        --s1: #3987e5;
        --s2: #d95926;
        --s3: #199e70;
        --s4: #c98500;
        --s5: #d55181;
        --s6: #008300;
        --s7: #9085e9;
        --s8: #e66767;

        --radius: 10px;
        --pad: 20px;
        --font: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 1060px; margin: 0 auto; padding: 48px var(--pad) 96px; }

      header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 28px; }
      h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
      .sub { color: var(--ink-3); font-size: 13px; }
      .status { margin-left: auto; font-size: 12px; color: var(--ink-3); font-family: var(--mono); }
      .status[data-state="error"] { color: var(--danger); }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
      }

      .plotwrap { display: flex; padding: 16px 0 16px 4px; }
      .scroll { overflow-x: auto; overscroll-behavior-x: contain; flex: 1; }
      .scroll::-webkit-scrollbar { height: 8px; }
      .scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
      #yaxis { flex: none; }
      .range { gap: 8px; margin: 12px 0 0; }
      .range input { padding: 5px 8px; font-size: 13px; }
      .range button { padding: 5px 10px; font-size: 13px; }
      svg { display: block; }
      .grid { stroke: var(--line); stroke-width: 1; }
      .axis { fill: var(--ink-3); font-size: 11px; font-family: var(--mono); }
      .axis-title { fill: var(--ink-3); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
      .today { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.8; }
      .mark { stroke-width: 2; }
      .mark:hover { stroke: var(--ink); }
      #tip {
        position: fixed; display: none; z-index: 10; pointer-events: none;
        background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
        padding: 8px 11px; font-size: 12.5px; line-height: 1.45; color: var(--ink-2);
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.5);
      }
      #tip b { color: var(--ink); font-weight: 550; }

      .legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
      .chip {
        display: inline-flex; align-items: center; gap: 7px;
        border: 1px solid var(--line); background: transparent; color: var(--ink-2);
        border-radius: 999px; padding: 4px 11px 4px 8px; font-size: 12.5px; cursor: pointer;
        white-space: nowrap;
      }
      input[type="checkbox"] { accent-color: var(--accent); }
      .chip[aria-pressed="false"] { opacity: 0.35; }
      .chip:hover { border-color: var(--ink-3); }

      form {
        display: grid; gap: 8px; margin: 28px 0 18px;
        grid-template-columns: minmax(160px, 2fr) minmax(110px, 1fr) 150px 110px auto;
      }
      input, select, button {
        font: inherit; color: var(--ink);
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 8px; padding: 8px 10px;
      }
      input:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
      button { cursor: pointer; }
      button:hover { border-color: var(--ink-3); }
      form button { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 550; }

      .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; color: var(--ink-3); font-size: 13px; }
      .bar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

      .row {
        display: grid; align-items: center; gap: 12px;
        grid-template-columns: 1fr 100px 86px 56px 76px 132px 52px 24px;
        padding: 6px 12px; border-bottom: 1px solid var(--line);
      }
      .row:hover { background: var(--surface); }
      .row.head {
        color: var(--ink-3); font-size: 12px; text-transform: uppercase;
        letter-spacing: 0.05em; padding-bottom: 8px; background: none;
      }
      .row.done .name, .row.skip .name { color: var(--ink-3); text-decoration: line-through; }
      .row.done .course, .row.skip .course { opacity: 0.5; }
      .row input[type="date"], .row select {
        padding: 3px 6px; font-size: 12.5px; font-family: var(--mono); color: var(--ink-2);
      }
      #search { flex: 1; max-width: 280px; padding: 6px 10px; font-size: 13px; }
      .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .course { color: var(--ink-2); font-size: 13px; }
      .left { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
      .left.soon { color: var(--warn); }
      .left.over { color: var(--danger); }
      .del { background: none; border: 0; color: var(--ink-3); padding: 2px 6px; }
      .del:hover { color: var(--danger); }
      .empty { color: var(--ink-3); padding: 24px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Eisenhower</h1>
        <span class="sub" id="count"></span>
        <span class="status" id="status"></span>
      </header>

      <div class="card plotwrap">
        <svg id="yaxis" width="44" height="340" aria-hidden="true"></svg>
        <div class="scroll">
          <svg id="plot" role="img" aria-label="Assignments by due date and importance"></svg>
        </div>
      </div>

      <div class="bar range">
        <label>next <input type="number" id="days" value="30" min="1" max="730" /> days</label>
        <span class="sub">scroll the plot sideways</span>
      </div>

      <div class="legend" id="legend"></div>

      <form id="add" autocomplete="off">
        <input id="f-name" placeholder="assignment" required />
        <input id="f-course" placeholder="course" list="courses" required />
        <datalist id="courses"></datalist>
        <input id="f-due" type="date" required />
        <select id="f-imp">
          <option value="1">importance 1</option>
          <option value="2" selected>importance 2</option>
          <option value="3">importance 3</option>
        </select>
        <button>Add</button>
      </form>

      <div class="bar">
        <input id="search" type="search" placeholder="search assignments" />
        <label><input type="checkbox" id="hide-done" checked /> hide done / not doing</label>
      </div>
      <div class="row head">
        <span>Assignment</span><span>Topic</span><span>Days Left</span>
        <span>Done?</span><span>Not Doing</span><span>Due Date</span><span>Imp.</span><span></span>
      </div>
      <div id="list"></div>
    </div>
    <div id="tip"></div>

    <script>
      const SHAPES = ['circle', 'square', 'triangle', 'diamond', 'down'];
      const SLOTS = 8;
      const DAY = 86400000;
      const $ = (s) => document.querySelector(s);

      let db = { courses: [], assignments: [] };
      let hidden = new Set(); // courses toggled off in the legend

      const color = (course) => `var(--s${(db.courses.indexOf(course) % SLOTS) + 1})`;
      const shape = (course) => SHAPES[db.courses.indexOf(course) % SHAPES.length];
      const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
      const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
      const daysLeft = (a) => Math.round((parse(a.due) - today()) / DAY);
      const fmt = (d) => d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
      const hash = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return h; };

      // one marker element, whatever its shape
      function mark(kind, x, y, r, attrs, inner = '') {
        const pts = {
          triangle: `${x},${y - r * 1.15} ${x + r * 1.1},${y + r * 0.8} ${x - r * 1.1},${y + r * 0.8}`,
          down: `${x},${y + r * 1.15} ${x + r * 1.1},${y - r * 0.8} ${x - r * 1.1},${y - r * 0.8}`,
          diamond: `${x},${y - r * 1.3} ${x + r * 1.2},${y} ${x},${y + r * 1.3} ${x - r * 1.2},${y}`,
        }[kind];
        const [tag, geo] =
          kind === 'circle'
            ? ['circle', `cx="${x}" cy="${y}" r="${r}"`]
            : kind === 'square'
              ? ['rect', `x="${x - r}" y="${y - r}" width="${r * 2}" height="${r * 2}" rx="1.5"`]
              : ['polygon', `points="${pts}"`];
        return `<${tag} ${geo} ${attrs}>${inner}</${tag}>`;
      }

      const byId = (id) => db.assignments.find((a) => a.id === id);

      function visible() {
        return db.assignments.filter(
          (a) => !hidden.has(a.course) && !(a.status !== 'open' && $('#hide-done').checked)
        );
      }

      // plot geometry — importance axis spans 0–4 so jitter around 1–3 never clips
      const H = 340, T = 22, B = 46, L = 14, R = 20, PX_DAY = 30, IMP_MAX = 4;
      const bandY = (imp) => H - B - (imp / IMP_MAX) * (H - T - B);

      // yesterday → N days out, N from the "next … days" box
      function span() {
        const t0 = today();
        const n = Math.min(730, Math.max(1, +$('#days').value || 30));
        return [new Date(t0 - DAY), new Date(t0.getTime() + n * DAY)];
      }

      function drawPlot() {
        const [min, max] = span();
        const days = (max - min) / DAY;
        const W = Math.max($('.scroll').clientWidth, days * PX_DAY + L + R);
        const x = (d) => L + ((d - min) / DAY / days) * (W - L - R);
        const t0 = today();
        const items = visible().filter((a) => parse(a.due) >= min && parse(a.due) <= max);

        let svg = '';
        for (let i = 1; i <= IMP_MAX; i++) svg += `<line class="grid" x1="0" x2="${W}" y1="${bandY(i)}" y2="${bandY(i)}" />`;

        const step = Math.max(1, Math.ceil(days / ((W - L - R) / 72)));
        for (let d = 0; d <= days; d += step) {
          const date = new Date(min.getTime() + d * DAY);
          const anchor = d === 0 ? 'start' : d + step > days ? 'end' : 'middle';
          svg += `<text class="axis" x="${x(date)}" y="${H - B + 22}" text-anchor="${anchor}">${fmt(date)}</text>`;
        }
        svg += `<line class="grid" x1="0" x2="${W}" y1="${H - B}" y2="${H - B}" />`;
        if (t0 >= min && t0 <= max) {
          svg += `<line class="today" x1="${x(t0)}" x2="${x(t0)}" y1="${T}" y2="${H - B}" />`;
          svg += `<text class="axis" x="${x(t0) + 6}" y="${T + 11}" fill="var(--accent)">today</text>`;
        }

        for (const a of items) {
          const jit = ((hash(a.id) % 100) / 100 - 0.5) * 0.7; // ±0.35 importance units
          const cx = x(parse(a.due)), cy = bandY(a.importance + jit), c = color(a.course);
          const open = a.status === 'open';
          svg += mark(
            shape(a.course), cx, cy, 4.5,
            `class="mark" fill="${open ? c : 'none'}" stroke="${c}" data-id="${a.id}"
             opacity="${open ? 1 : 0.5}" ${a.status === 'skip' ? 'stroke-dasharray="2 2"' : ''}`
          );
        }
        const plot = $('#plot');
        plot.setAttribute('viewBox', `0 0 ${W} ${H}`);
        plot.setAttribute('width', W);
        plot.setAttribute('height', H);
        plot.innerHTML = svg;

        // fixed gutter so the importance scale stays put while the dates scroll
        $('#yaxis').setAttribute('height', H);
        $('#yaxis').innerHTML =
          [0, 1, 2, 3, 4].map((i) => `<text class="axis" x="34" y="${bandY(i) + 4}" text-anchor="end">${i}</text>`).join('') +
          `<text class="axis-title" transform="translate(13 ${(H - B + T) / 2}) rotate(-90)" text-anchor="middle">importance</text>`;
      }

      function drawLegend() {
        $('#legend').innerHTML = db.courses
          .map(
            (c) => `<button class="chip" aria-pressed="${!hidden.has(c)}" data-course="${c}">
              <svg width="12" height="12" viewBox="0 0 12 12">${mark(shape(c), 6, 6, 4.5, `fill="${color(c)}"`)}</svg>
              ${c}</button>`
          )
          .join('');
        $('#courses').innerHTML = db.courses.map((c) => `<option value="${c}">`).join('');
      }

      function drawList() {
        const q = $('#search').value.trim().toLowerCase();
        const items = visible()
          .filter((a) => !q || (a.name + ' ' + a.course).toLowerCase().includes(q))
          .sort((a, b) => a.due.localeCompare(b.due) || a.name.localeCompare(b.name));
        $('#count').textContent = `${db.assignments.filter((a) => a.status === 'open').length} open`;
        $('#list').innerHTML =
          items
            .map((a) => {
              const d = daysLeft(a);
              const cls = d < 0 ? 'over' : d <= 2 ? 'soon' : '';
              return `<div class="row ${a.status}">
                <span class="name">${a.name}</span>
                <span class="course" style="color:${color(a.course)}">${a.course}</span>
                <span class="left ${cls}">${d < 0 ? `${-d} days late` : d === 1 ? '1 day' : `${d} days`}</span>
                <input type="checkbox" data-set="done" data-id="${a.id}" ${a.status === 'done' ? 'checked' : ''} />
                <input type="checkbox" data-set="skip" data-id="${a.id}" ${a.status === 'skip' ? 'checked' : ''} />
                <input type="date" class="due" data-field="due" data-id="${a.id}" value="${a.due}" />
                <select class="imp" data-field="importance" data-id="${a.id}">
                  ${[0, 1, 2, 3, 4].map((i) => `<option ${a.importance === i ? 'selected' : ''}>${i}</option>`).join('')}
                </select>
                <button class="del" data-del="${a.id}" title="delete">×</button>
              </div>`;
            })
            .join('') || '<div class="empty">nothing here.</div>';
      }

      const render = () => { drawPlot(); drawLegend(); drawList(); };

      async function save(msg) {
        render();
        const s = $('#status');
        try {
          const r = await fetch('/db', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ data: db, msg }),
          });
          if (!r.ok) throw new Error(await r.text());
          s.dataset.state = 'ok';
          s.textContent = 'saved';
        } catch (e) {
          s.dataset.state = 'error';
          s.textContent = 'not saved: ' + e.message;
        }
      }

      $('#add').onsubmit = (e) => {
        e.preventDefault();
        const course = $('#f-course').value.trim();
        const a = {
          id: Math.random().toString(36).slice(2, 9),
          name: $('#f-name').value.trim(),
          course,
          due: $('#f-due').value,
          importance: +$('#f-imp').value,
          status: 'open',
        };
        if (!db.courses.includes(course)) db.courses.push(course);
        db.assignments.push(a);
        e.target.reset();
        $('#f-imp').value = '2';
        $('#f-name').focus();
        save(`add ${a.name} (${a.course}) due ${a.due}`);
      };

      document.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (chip) {
          const c = chip.dataset.course;
          hidden.has(c) ? hidden.delete(c) : hidden.add(c);
          return render();
        }
        const del = e.target.dataset.del;
        if (del) {
          const a = byId(del);
          db.assignments = db.assignments.filter((x) => x.id !== del);
          save(`delete ${a.name} (${a.course})`);
        }
      });

      document.addEventListener('change', (e) => {
        const { id, set, field } = e.target.dataset;
        if (!id) return;
        const a = byId(id);
        if (set) {
          a.status = e.target.checked ? set : 'open'; // done / not doing are mutually exclusive
          return save(`${a.status === 'open' ? 'reopen' : a.status}: ${a.name} (${a.course})`);
        }
        a[field] = field === 'importance' ? +e.target.value : e.target.value;
        save(`${a.name} (${a.course}) ${field} → ${a[field]}`);
      });

      // hover card — the plot is read-only, points only explain themselves
      const tip = $('#tip');
      const place = (e) => {
        tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
        tip.style.top = Math.max(8, e.clientY - tip.offsetHeight - 12) + 'px';
      };
      $('#plot').addEventListener('mouseover', (e) => {
        const m = e.target.closest('.mark');
        if (!m) return;
        const a = byId(m.dataset.id);
        const d = daysLeft(a);
        tip.innerHTML = `<b>${a.name}</b><br /><span style="color:${color(a.course)}">${a.course}</span>
          · importance ${a.importance}<br />${a.due} · ${d < 0 ? `${-d}d late` : `${d}d left`}${
          a.status === 'open' ? '' : ` · ${a.status === 'skip' ? 'not doing' : 'done'}`
        }`;
        tip.style.display = 'block';
        place(e);
      });
      $('#plot').addEventListener('mousemove', (e) => tip.style.display === 'block' && place(e));
      $('#plot').addEventListener('mouseout', (e) => {
        if (e.target.closest('.mark')) tip.style.display = 'none';
      });

      $('#hide-done').onchange = render;
      $('#days').oninput = drawPlot;
      $('#search').oninput = drawList;
      addEventListener('resize', drawPlot);

      fetch('db.json')
        .then((r) => r.json())
        .then((d) => { db = d; render(); })
        .catch(() => ($('#list').innerHTML = '<div class="empty">run <code>node server.js</code> and open localhost:47913</div>'));
    </script>
  </body>
</html>
